[package]
name = "postbor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "CBOR as a first-class PostgreSQL type, the counterpart of jsonb"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["pg18"]
pg15 = ["pgrx/pg15"]
pg16 = ["pgrx/pg16"]
pg17 = ["pgrx/pg17"]
pg18 = ["pgrx/pg18"]

[dependencies]
pgrx = "=0.20.0"
postbor-core = { path = "../core" }
