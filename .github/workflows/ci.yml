# Every change: clippy and the SQL suites on PostgreSQL 15-18, core tests, Miri, and a short fuzz run of each target.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PGRX_VERSION: 0.20.0
  # Miri and cargo-fuzz need nightly; a dated one keeps runs reproducible.
  NIGHTLY: nightly-2026-11-18

jobs:
  sql:
    name: PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pg: [15, 16, 17, 18]
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies (PostgreSQL from source, bindgen)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev bison flex pkg-config \
            libreadline-dev zlib1g-dev libxml2-dev libxslt1-dev libssl-dev libicu-dev

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-pgrx
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-pg${{ matrix.pg }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-pg${{ matrix.pg }}-

      # pgrx builds each PostgreSQL from source, which takes minutes: the installation is cached.
      - uses: actions/cache@v4
        with:
          path: ~/.pgrx
          key: pgrx-${{ env.PGRX_VERSION }}-pg${{ matrix.pg }}-${{ runner.os }}

      - name: cargo-pgrx
        run: |
          cargo pgrx --version 2>/dev/null | grep -q " $PGRX_VERSION$" \
            || cargo install cargo-pgrx --version "$PGRX_VERSION" --locked --force

      - name: PostgreSQL ${{ matrix.pg }}
        run: |
          pgc=$(ls -d ~/.pgrx/${{ matrix.pg }}.*/pgrx-install/bin/pg_config 2>/dev/null | head -n 1)
          if [ -n "$pgc" ]; then
            cargo pgrx init --pg${{ matrix.pg }} "$pgc"
          else
            cargo pgrx init --pg${{ matrix.pg }} download
          fi

      - name: Clippy
        run: cd postcbor && cargo clippy --all-targets --no-default-features --features pg${{ matrix.pg }} -- -D warnings

      # The default features are pg18: the workspace-wide checks run once.
      - name: Clippy (workspace)
        if: matrix.pg == 18
        run: make clippy

      - name: Core and SQL tests
        run: make test-matrix PG_VERSIONS=${{ matrix.pg }}

      - name: Regression differences
        if: failure()
        run: cat postcbor/tests/pg_regress/regression.diffs || true

  miri:
    name: Miri (core)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Nightly with Miri
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component miri,rust-src
          cargo +"$NIGHTLY" miri setup
      - run: make miri NIGHTLY="$NIGHTLY"

  fuzz:
    name: Fuzz (30 s per target)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Nightly with cargo-fuzz
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal
          cargo +"$NIGHTLY" install cargo-fuzz --version 0.13.2 --locked
      - run: make fuzz NIGHTLY="$NIGHTLY" FUZZ_SECONDS=30
      - name: Crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
