# Documentation site: a strict build on every change (broken links fail it). Pushes to main publish the "dev"
# version; a release tag vX.Y.Z publishes version X.Y and points "latest" (the default) at it. mike commits each
# version to the gh-pages branch, which GitHub Pages serves (Settings → Pages → Deploy from a branch: gh-pages).
name: Docs

on:
  push:
  pull_request:

# Runs on main and on tags queue instead of cancelling each other, so a deployment is never cut off half-way.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make docs

  deploy:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    # One deployment at a time across main and tags: each one commits to gh-pages.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages || true
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$(echo "${GITHUB_REF_NAME#v}" | cut -d. -f1,2)
            make docs-deploy DOCS_VERSION="$version" DOCS_ALIAS=latest MIKE_FLAGS=--push
          else
            make docs-deploy DOCS_VERSION=dev MIKE_FLAGS=--push
          fi
